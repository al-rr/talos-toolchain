# Versioned yamllint policy for talos-toolchain tracked YAML.
#
# Extends yamllint's "default" ruleset and relaxes only what this
# repository's real YAML files require. It does not disable the ruleset
# wholesale.
extends: default

# Fixtures under scripts/talos/tests/fixtures/render/ are captured
# `helm template` output, not YAML authored in this repository. They are a
# multi-document manifest stream, so the "---" separators this policy forbids
# are structurally required, and the list indentation is Helm's own.
# Reformatting them to satisfy a style rule would make them stop matching what
# the real tool emits — which is the whole point of a fixture. Style is
# checked on YAML this repository writes; recorded tool output is exempt.
ignore: |
  scripts/talos/tests/fixtures/render/

rules:
  line-length:
    # GitHub issue-form "dropdown" options are a single flow-sequence line;
    # the longest tracked line today is ~153 chars. 160 gives headroom
    # without disabling the check.
    max: 160
  document-start:
    # Issue-form templates and workflow files in this repository do not use
    # a leading "---" document marker.
    present: false
  truthy:
    # GitHub Actions workflows use the bare `on:` trigger key; do not flag
    # map keys, only scalar values.
    check-keys: false
