name: Bug / Problema
description: Algo quebrado fora do fluxo de uma iteração formal
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: modulo
    attributes:
      label: Módulo/área afetada
      options: ["day-1 lifecycle", "day-2 GitOps", "cluster scaffold", "shell library", "vSphere integration", "documentação", "outro"]
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: atual
    attributes:
      label: Comportamento atual
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Passos para reproduzir
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs/evidência
      render: shell
    validations:
      required: false
